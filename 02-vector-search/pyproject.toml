[project]
name = "vector-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "minsearch>=0.2.0",
    "onnxruntime>=1.31.1",
    "openai>=3.39.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

# CPU-only torch: the default PyPI wheels bundle CUDA (several GB), even on aarch64
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
]
